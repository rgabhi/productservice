name: student-checkout
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: local-demo-only
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - checkout-pg:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  kafka-storage:
    # The official broker runs as UID 1000; initialise the named volume's owner.
    image: apache/kafka:4.1.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1000:1000 /data"]
    volumes: ["checkout-kafka:/data"]
  kafka:
    depends_on:
      kafka-storage: {condition: service_completed_successfully}
    image: apache/kafka:4.1.1
    ports: ["127.0.0.1:19092:19092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - checkout-kafka:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  orders:
    build: .
    command: uvicorn services.orders.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://orders:orders@postgres/orders
      KAFKA_BOOTSTRAP: kafka:9092
      INVENTORY_URL: http://inventory:8000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      inventory: {condition: service_started}
  inventory:
    build: .
    command: uvicorn services.inventory.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://inventory:inventory@postgres/inventory
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
  payments:
    build: .
    command: uvicorn services.payments.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://payments:payments@postgres/payments
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["127.0.0.1:8002:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
volumes:
  checkout-pg:
  checkout-kafka:
