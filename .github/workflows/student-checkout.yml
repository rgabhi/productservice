name: Student checkout integration
on: [push, pull_request, workflow_dispatch]
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt
      - run: python tools/dev.py up
      - run: python tools/dev.py test
      - run: python tools/dev.py failure-demo
      - run: python tools/dev.py demo
      - if: always()
        run: docker compose logs --no-color > checkout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-logs
          path: checkout.log
      - if: always()
        run: docker compose down
